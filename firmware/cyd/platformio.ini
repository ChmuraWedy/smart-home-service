[platformio]
default_envs = cyd-028r

[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
    lvgl/lvgl@8.4.0
    lovyan03/LovyanGFX@1.2.7
    bblanchon/ArduinoJson@6.21.5
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -D CORE_DEBUG_LEVEL=0
    -D USER_SETUP_LOADED

[env:cyd-028r]
build_flags = ${env.build_flags} -D CYD_028R

[env:cyd-028r-st7789]
build_flags = ${env.build_flags} -D CYD_028R -D CYD_ST7789

[env:cyd-028c]
build_flags = ${env.build_flags} -D CYD_028C

[env:cyd-035r]
build_flags = ${env.build_flags} -D CYD_035R

[env:cyd-035c]
build_flags = ${env.build_flags} -D CYD_035C
