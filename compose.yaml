name: smart-home-service

services:
  smart-home:
    build: .
    image: ${SMART_HOME_IMAGE:-smart-home-service:local}
    restart: unless-stopped
    env_file: .env
    environment:
      SMART_HOME_API_TOKEN: ${SMART_HOME_API_TOKEN:?Set SMART_HOME_API_TOKEN in .env}
      SMART_HOME_DB: /app/data/smarthome.db
      SMART_HOME_CLOUD_SESSION: /app/data/tuya-cloud.json
      SMART_HOME_DEVELOPER_SESSION: /app/data/tuya-cloud.json.developer.json
      SMART_HOME_CORS_ORIGINS: ""
      SMART_HOME_FRONTEND_URL: ""
    ports:
      - "0.0.0.0:${SMART_HOME_PORT:-8080}:8080"
    volumes:
      - smart-home-data:/app/data
    stop_grace_period: 30s

volumes:
  smart-home-data:
