[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-home-service"
version = "0.8.3"
description = "Local smart-home REST API with SQLite or PostgreSQL and TinyTuya gateway support"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "SQLAlchemy>=2.0,<2.1",
  "pydantic>=2.9,<3", "tinytuya>=1.17,<2", "pycryptodome>=3.20,<4",
  "Pillow>=12.3,<14",
]

[project.optional-dependencies]
cloud = ["tuya-device-sharing-sdk==0.2.15", "qrcode>=8,<9"]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
smart-home = "smarthome.cli:main"
smart-home-migrate-postgres = "smarthome.migrate_postgres:main"

[tool.setuptools.packages.find]
include = ["smarthome*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E501"]
