worker_processes auto;
pid /tmp/smart-home-nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_body_temp_path /tmp/smart-home-client;
    proxy_temp_path /tmp/smart-home-proxy;
    fastcgi_temp_path /tmp/smart-home-fastcgi;
    uwsgi_temp_path /tmp/smart-home-uwsgi;
    scgi_temp_path /tmp/smart-home-scgi;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /app/web;
        index index.html;

        location = /cloud { return 302 /; }
        location ~ ^/(api(?:/|$)|health$|docs(?:/|$)|redoc$|openapi\.json$) {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 130s;
            proxy_buffering off;
            add_header Cache-Control "no-store" always;
        }
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
