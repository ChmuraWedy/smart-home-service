worker_processes auto;
pid /tmp/smart-home-nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_body_temp_path /tmp/smart-home-client;
    proxy_temp_path /tmp/smart-home-proxy;
    fastcgi_temp_path /tmp/smart-home-fastcgi;
    uwsgi_temp_path /tmp/smart-home-uwsgi;
    scgi_temp_path /tmp/smart-home-scgi;
    # Resolve the Compose service again when a replacement backend gets a new IP.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /app/web;
        index index.html;
        set $backend_host ${SMART_HOME_BACKEND_HOST};

        location = /cloud { return 302 /; }
        # Playback paths contain temporary credentials for native HLS players.
        location ^~ /api/v1/camera/play/ {
            access_log off;
            error_log /dev/null crit;
            include /app/deploy/nginx-api.conf;
        }
        location ~ ^/(api(?:/|$)|health$|docs(?:/|$)|redoc$|openapi\.json$) {
            include /app/deploy/nginx-api.conf;
        }
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
