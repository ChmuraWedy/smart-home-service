worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    limit_req_zone $binary_remote_addr zone=search:1m rate=10r/s;
    server {
        listen 8096 ssl;
        server_name homeassistant.dom duszadomu.dom damawik.dom moj.dom;
        ssl_certificate /certs/dashboard.crt;
        ssl_certificate_key /certs/dashboard.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        auth_basic "Home logs (owner)";
        auth_basic_user_file /etc/nginx/log-users;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        client_max_body_size 128k;
        location = / { return 302 /select/vmui/; }
        # The app hands off a 60-second ticket in a POST body, never a URL.
        location = /session {
            auth_basic off;
            limit_except POST { deny all; }
            client_max_body_size 1k;
            limit_req zone=search burst=5 nodelay;
            proxy_pass http://127.0.0.1:8082/api/v1/log-search/session;
            proxy_set_header Authorization "";
            proxy_set_header X-API-Key "";
            proxy_set_header Cookie "";
        }
        location = /_log_session {
            internal;
            auth_basic off;
            proxy_pass http://127.0.0.1:8082/api/v1/log-search/authorize;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization "";
            proxy_set_header X-API-Key "";
        }
        location /select/ {
            # Existing Basic sign-in remains available alongside the scoped cookie.
            satisfy any;
            auth_request /_log_session;
            limit_except GET POST { deny all; }
            limit_req zone=search burst=30 nodelay;
            proxy_pass http://127.0.0.1:9428;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header X-API-Key "";
            proxy_set_header AccountID "0";
            proxy_set_header ProjectID "0";
            proxy_read_timeout 35s;
            proxy_buffering off;
        }
        location / { return 404; }
    }
}
